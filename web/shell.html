<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>My Hunter — raylib web edition</title>
    <style>
        html, body { margin: 0; padding: 0; background: #101018; height: 100%; overflow: hidden; }
        body { display: flex; align-items: center; justify-content: center; font-family: sans-serif;
               height: 100vh; height: 100dvh; }
        #canvas { border: 2px solid #333; background: black; image-rendering: pixelated;
                  cursor: none; max-width: 100vw; max-height: 100vh; max-height: 100dvh;
                  width: auto; height: auto; object-fit: contain; }
        #loading { color: white; position: absolute; }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <!-- Pseudo edit field (scoreboard): a REAL HTML input, not drawn on
         the canvas, so mobile browsers actually pop up their on-screen
         keyboard when it's focused -- raylib's canvas has no way to
         trigger that on its own. Positioned/sized over the canvas from
         C via pseudoInputShow() (see below), hidden otherwise. -->
    <input id="pseudo-input" type="text" maxlength="20" autocomplete="off"
           style="position:absolute; display:none; box-sizing:border-box;
                  font-family:sans-serif; border-radius:6px; border:2px solid #82828f;
                  background:#23232a; color:#fff; padding:0 8px;">
    <script type='text/javascript'>
        (function() {
            var input = document.getElementById('pseudo-input');
            var committed = false;
            var shown = false;
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { committed = true; input.blur(); }
            });
            input.addEventListener('blur', function() { committed = true; });

            // Positions/sizes/shows the field every frame, but does NOT
            // touch its value -- the browser input is the live source
            // of truth for what's being typed once shown. (Previously
            // this also force-set input.value from the C-side buffer
            // every frame, which raced with typing: C's buffer only
            // catches up to what was typed via pseudoInputGetValue()
            // AFTER this runs, so the next frame's forced value write
            // kept reverting every keystroke before it could ever reach
            // the C side -- the actual cause of "can't type a name".)
            window.pseudoInputShow = function(x, y, w, h, fontSize) {
                var canvas = document.getElementById('canvas');
                var rect = canvas.getBoundingClientRect();
                var scaleX = rect.width / canvas.width;
                var scaleY = rect.height / canvas.height;
                input.style.left = (rect.left + x * scaleX) + 'px';
                input.style.top = (rect.top + y * scaleY) + 'px';
                input.style.width = (w * scaleX) + 'px';
                input.style.height = (h * scaleY) + 'px';
                input.style.fontSize = (fontSize * scaleY) + 'px';
                input.style.display = 'block';
                if (!shown) { input.focus(); shown = true; }
            };
            window.pseudoInputHide = function() {
                input.style.display = 'none';
                input.blur();
                shown = false;
            };
            // Explicit, C-initiated value override (initial default
            // pseudo, roll button) -- separate from the per-frame
            // show() above so it never fights with live typing.
            window.pseudoInputSetValue = function(value) {
                input.value = value;
            };
            window.pseudoInputGetValue = function() {
                return input.value;
            };
            window.pseudoInputConsumeCommitted = function() {
                var c = committed;
                committed = false;
                return c;
            };
        })();
    </script>
    <script type='text/javascript'>
        var Module = {
            print: (function() { return function(text) { console.log(text); }; })(),
            printErr: function(text) { console.error(text); },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                document.getElementById('loading').innerHTML = text;
                if (!text) document.getElementById('loading').style.display = 'none';
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) +
                                  '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };
        Module.setStatus('Downloading...');
    </script>
    {{{ SCRIPT }}}
</body>
</html>
